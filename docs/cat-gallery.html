function paint(line) {
  let html = esc(line);
  for (const [re, cls] of ACCENTS) {
    html = html.replace(new RegExp(re.source.replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'g'), m => `<span class="${cls}">${m}</span>`);
  }
  return html.replace(/\{([^}]*)\}/g, '|<span class="screen">$1</span>|');
}

  const s = document.createElement('section');
  s.innerHTML = `<h2>${sec.title}</h2><p>${sec.note}</p><div class="grid"></div>`;
  const grid = s.querySelector('.grid');
  CATS.filter(c => c.mode === sec.key).forEach(cat => {
    n += 1; cat.id = n;
    const card = document.createElement('div');
    card.className = 'card' + (picked.has(n) ? ' on' : '');
    card.innerHTML = `<div class="head"><span class="num">#${String(n).padStart(2, '0')}</span><span class="name">${cat.name}</span>
      <input type="checkbox" id="pick-${n}" aria-label="${cat.name} 고르기" ${picked.has(n) ? 'checked' : ''}></div>
      <div class="term"><pre></pre></div><p class="desc">${cat.desc}</p><p class="verbs">${VERBS[n - 1].map(v => v + '…').join('  ')}</p>`;
    card.querySelector('input').addEventListener('change', e => {
      e.target.checked ? picked.add(cat.id) : picked.delete(cat.id);
      card.classList.toggle('on', e.target.checked); renderPicked();
    });
    grid.appendChild(card);
    nodes.push({ cat, pre: card.querySelector('pre'), verbs: VERBS[n - 1], secs: 3 + (n * 7) % 40 });
  });
  root.appendChild(s);
}

function framesOf(cat) {
  const fs = cat.frames.map(f => ascii ? f.map(l => ASCII_MAP.reduce((s, [re, r]) => s.replace(re, r), l)) : f.map(l => l.replace(/[-˘](?=ω)|(?<=ω)[-˘]/g, closed).replace(/˙/g, '•').split('ω').join(mouth)));
  const w = Math.max(...fs.flat().map(width));
  return fs.map(f => f.map(l => pad(l, w)));
}

function shimmer(word, t) {
  const pos = (t / 90) % (word.length + 6) - 3;
  return [...word].map((ch, i) => {
    const d = Math.abs(i - pos);
    const c = d < 1 ? '#ffd6c4' : d < 2.2 ? '#eba58a' : 'var(--claude)';
    return `<span style="color:${c}">${ch}</span>`;
  }).join('');
}

const start = performance.now();
function tick(now) {
  const t = now - start;
  const g = GLYPHS[Math.floor(t / 120) % GLYPHS.length];
  for (const nd of nodes) {
    const fs = framesOf(nd.cat);
    const f = fs[Math.floor(t * speed / nd.cat.ms) % fs.length];
    const secs = nd.secs + Math.floor(t / 1000);
    const word = nd.verbs[Math.floor(t / 3500) % nd.verbs.length];
    const line = `<span class="glyph">${g}</span> <span class="word">${shimmer(word + '…', t)}</span> <span class="meta">(${secs}s · ↓ ${(1.2 + nd.secs / 10).toFixed(1)}k tokens · high effort)</span>`;
    const top = `<span class="cat">${paint(f[0])}</span>`;
    const bottom = `<span class="cat">${paint(f[1])}</span>  ${line}`;
    nd.pre.innerHTML = nd.cat.mode === 'mini' ? `<span class="cat">${paint(f[1])}</span>  ${line}` : `${top}\n${bottom}`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function renderPicked() {
  const ids = [...picked].sort((a, b) => a - b);
  try { localStorage.setItem('picked', JSON.stringify(ids)); } catch {}
  const el = document.getElementById('picked');
  el.innerHTML = ids.length ? `고른 고양이 <b>${ids.length}</b>종: ${ids.map(i => '#' + i).join(', ')}` : '아직 고른 고양이가 없어요';
}
renderPicked();

const mouthBox = document.getElementById('mouths');
MOUTHS.forEach(([m, label], i) => {
  const el = document.createElement('label');
  el.title = label;
  el.innerHTML = `<input type="radio" name="mouth" id="mouth-${i}" value="${m}" ${m === mouth ? 'checked' : ''}><span>${m}</span>`;
  el.querySelector('input').addEventListener('change', () => { mouth = m; try { localStorage.setItem('mouth', m); } catch {} });
  mouthBox.appendChild(el);
});
const closedBox = document.getElementById('closeds');
CLOSEDS.forEach(([m, label], i) => {
  const el = document.createElement('label');
  el.title = label;
  el.innerHTML = `<input type="radio" name="closed" id="closed-${i}" value="${m}" ${m === closed ? 'checked' : ''}><span>${m}</span>`;
  el.querySelector('input').addEventListener('change', () => { closed = m; try { localStorage.setItem('closed2', m); } catch {} });
  closedBox.appendChild(el);
});
document.getElementById('ascii').addEventListener('change', e => { ascii = e.target.checked; });
document.getElementById('speed').addEventListener('input', e => { speed = Number(e.target.value); });
document.getElementById('copy').addEventListener('click', async e => {
  const text = '고른 고양이: ' + [...picked].sort((a, b) => a - b).map(i => '#' + i).join(', ');
  try { await navigator.clipboard.writeText(text); e.target.textContent = '복사했어요'; }
  catch { document.getElementById('picked').textContent = text; e.target.textContent = '위 글자를 직접 복사해 주세요'; }
  setTimeout(() => { e.target.textContent = '번호 복사'; }, 1800);
});
</script>
